<!DOCTYPE html>
<!-- ===== START: CHECKOUT PAGE ===== -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Stride</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container section">
    <h2>Checkout</h2>
    <div id="checkout-msg"></div>

    <div class="cart-layout">
      <div>
        <!-- ===== START: SHIPPING ADDRESS ===== -->
        <div class="form-card" style="margin:0 0 24px;">
          <h3>Shipping Address</h3>
          <form id="address-form" class="mt-16">
            <div class="field"><label for="addr-name">Full Name</label><input id="addr-name" required /></div>
            <div class="field"><label for="addr-line1">Address</label><input id="addr-line1" required /></div>
            <div class="field"><label for="addr-city">City</label><input id="addr-city" required /></div>
            <div class="field"><label for="addr-zip">ZIP / Postal Code</label><input id="addr-zip" required /></div>
            <div class="field"><label for="addr-phone">Phone</label><input id="addr-phone" required /></div>
          </form>
        </div>
        <!-- ===== END: SHIPPING ADDRESS ===== -->

        <!-- Cash on delivery only until a real payment gateway is configured -->
        <div class="form-card" style="margin:0;">
          <h3>Payment Method</h3>
          <div class="mt-16">
            <label class="pay-method selected" id="method-cod">
              <input type="radio" name="pay-method" value="cod" checked />
              <div>
                <strong>Cash on Delivery</strong>
                <p style="font-size:.82rem; color:var(--ink-soft);">Pay when your order arrives. Online card payment is not enabled yet.</p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- ===== START: ORDER SUMMARY / PLACE ORDER ===== -->
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div id="checkout-lines" class="mt-16"></div>
        <div class="summary-row"><span>Subtotal</span><span id="co-subtotal">৳0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="co-shipping">৳0</span></div>
        <div class="summary-row"><span>Tax (not currently added)</span><span id="co-tax">৳0</span></div>
        <div class="summary-row total"><span>Total</span><span id="co-total">৳0</span></div>
        <button id="place-order" class="btn btn-primary btn-block mt-16">Place Order</button>
      </div>
      <!-- ===== END: ORDER SUMMARY / PLACE ORDER ===== -->
    </div>
  </div>

  <div id="site-footer"></div>
  <div id="chat-widget"></div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
<!-- ===== END: CHECKOUT PAGE ===== -->
