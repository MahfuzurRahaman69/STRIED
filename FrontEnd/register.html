<!DOCTYPE html>
<!-- ===== START: REGISTER PAGE ===== -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Stride</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container">
    <form id="register-form" class="form-card">
      <h2>Create Account</h2>
      <div id="register-msg"></div>
      <div class="field"><label for="reg-name">Full Name</label><input id="reg-name" type="text" required /></div>
      <div class="field"><label for="reg-email">Email</label><input id="reg-email" type="email" required /></div>
      <div class="field"><label for="reg-password">Password</label><input id="reg-password" type="password" minlength="6" required /></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      <p class="text-center mt-16" style="font-size:.85rem;">Already have an account? <a href="login.html" style="text-decoration:underline;">Log in</a></p>
    </form>
  </div>

  <div id="site-footer"></div>
  <div id="chat-widget"></div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
<!-- ===== END: REGISTER PAGE ===== -->
